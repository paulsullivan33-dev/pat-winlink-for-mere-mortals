site_name: Pat (Winlink) for Mere Mortals
site_description: Email that works when the internet does not. Pat is the open source Winlink client that holds your mailbox on your own machine and carries mail by internet, HF radio, packet and VARA, with the local half run for real and the connection chapters labelled as documented.
site_url: https://paulsullivan33-dev.github.io/pat-winlink-for-mere-mortals/
copyright: 'Part of <a href="https://paulsullivan33-dev.github.io/mere-mortals/">For Mere Mortals</a> · Text CC BY 4.0, code MIT'

